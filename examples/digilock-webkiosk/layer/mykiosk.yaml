# METABEGIN
# X-Env-Layer-Name: digilock-kiosk
# X-Env-Layer-Category: example
# X-Env-Layer-Desc: Minimal webkiosk layer for local web apps. Installs browser
#  runtime and creates a kiosk service. The app itself is installed via the
#  top-level packages section in config.
#  We depend on the RPi user creds layer as we want to run the kiosk as the
#  user it creates, and we depend on systemd because we install a systemd
#  service to start the kiosk.
# X-Env-Layer-Requires: rpi-user-credentials,systemd-net-min,systemd-timesyncd
#
# X-Env-VarPrefix: kiosk
#
# X-Env-Var-port: 8080
# X-Env-Var-port-Desc: Localhost port opened by your web application.
# X-Env-Var-port-Required: n
# X-Env-Var-port-Valid: regex:^(?:[1-9][0-9]{0,4})$
# X-Env-Var-port-Set: y
#
# X-Env-Var-url:
# X-Env-Var-url-Desc: Optional full URL override. If empty, service uses
#  http://localhost:$IGconf_kiosk_port.
# X-Env-Var-url-Required: n
# X-Env-Var-url-Valid: string
# X-Env-Var-url-Set: n
# METAEND
---
mmdebstrap:
  packages:
    - cage
    - chromium
  customize-hooks:
    - |
      set -eu
      export KIOSK_USER="$IGconf_device_user1"
      export KIOSK_RUNDIR="/home/$IGconf_device_user1"

      if [ -n "${IGconf_kiosk_url:-}" ]; then
        export KIOSK_URL="$IGconf_kiosk_url"
      else
        export KIOSK_URL="http://localhost:$IGconf_kiosk_port"
      fi

      export KIOSK_APP="/usr/bin/chromium $KIOSK_URL --kiosk --noerrdialogs --disable-infobars --no-first-run --enable-features=OverlayScrollbar --start-maximized"
      envsubst < kiosk.service.tpl > $1/etc/systemd/system/kiosk.service
    - $BDEBSTRAP_HOOKS/enable-units "$1" kiosk
