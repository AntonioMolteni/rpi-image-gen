# METABEGIN
# X-Env-Layer-Name: digilock-kiosk
# X-Env-Layer-Category: example
# X-Env-Layer-Desc: Minimal webkiosk layer for local web apps. Installs browser
#  runtime and creates a kiosk service. The app itself is installed via the
#  top-level packages section in config.
#  We depend on the RPi user creds layer as we want to run the kiosk as the
#  user it creates, and we depend on systemd because we install a systemd
#  service to start the kiosk.
# X-Env-Layer-Requires: rpi-user-credentials,systemd-net-min,systemd-timesyncd
#
# X-Env-VarPrefix: kiosk
#
# X-Env-Var-port: 8080
# X-Env-Var-port-Desc: Localhost port opened by your web application.
# X-Env-Var-port-Required: n
# X-Env-Var-port-Valid: regex:^(?:[1-9][0-9]{0,4})$
# X-Env-Var-port-Set: y
#
# X-Env-Var-url:
# X-Env-Var-url-Desc: Optional full URL override. If empty, service uses
#  http://localhost:$IGconf_kiosk_port.
# X-Env-Var-url-Required: n
# X-Env-Var-url-Valid: string
# X-Env-Var-url-Set: n
#
# X-Env-Var-app_pkg:
# X-Env-Var-app_pkg-Desc: Package name to install from your apt repository.
# X-Env-Var-app_pkg-Required: n
# X-Env-Var-app_pkg-Valid: string
# X-Env-Var-app_pkg-Set: n
#
# X-Env-Var-repo_url:
# X-Env-Var-repo_url-Desc: Apt repository URL for your web app package.
# X-Env-Var-repo_url-Required: n
# X-Env-Var-repo_url-Valid: string
# X-Env-Var-repo_url-Set: n
#
# X-Env-Var-repo_suite: stable
# X-Env-Var-repo_suite-Desc: Apt repository suite (for example stable).
# X-Env-Var-repo_suite-Required: n
# X-Env-Var-repo_suite-Valid: string
# X-Env-Var-repo_suite-Set: y
#
# X-Env-Var-repo_component: main
# X-Env-Var-repo_component-Desc: Apt repository component (for example main).
# X-Env-Var-repo_component-Required: n
# X-Env-Var-repo_component-Valid: string
# X-Env-Var-repo_component-Set: y
#
# X-Env-Var-repo_key: ${@SRCROOT}/keyrings/digilock-kiosk-archive-keyring.asc
# X-Env-Var-repo_key-Desc: Path to ASCII-armored public key for your apt repo.
# X-Env-Var-repo_key-Required: n
# X-Env-Var-repo_key-Valid: string
# X-Env-Var-repo_key-Set: y
# METAEND
---
mmdebstrap:
  packages:
    - cage
    - chromium
  customize-hooks:
    - |
      set -eu

      if [ -n "${IGconf_kiosk_repo_url:-}" ] && [ -n "${IGconf_kiosk_app_pkg:-}" ]; then
        if [ ! -f "$IGconf_kiosk_repo_key" ]; then
          echo "kiosk repo key file not found: $IGconf_kiosk_repo_key"
          exit 1
        fi

        install -d -m 0755 "$1/etc/apt/keyrings"
        install -m 0644 "$IGconf_kiosk_repo_key" \
          "$1/etc/apt/keyrings/digilock-kiosk-archive-keyring.asc"

        {
          echo "Types: deb"
          echo "URIs: ${IGconf_kiosk_repo_url}"
          echo "Suites: ${IGconf_kiosk_repo_suite}"
          echo "Components: ${IGconf_kiosk_repo_component}"
          echo "Signed-By: /etc/apt/keyrings/digilock-kiosk-archive-keyring.asc"
        } > "$1/etc/apt/sources.list.d/digilock-kiosk.sources"

        chroot "$1" apt update
        chroot "$1" apt install -y "$IGconf_kiosk_app_pkg"
      fi

      export KIOSK_USER="$IGconf_device_user1"
      export KIOSK_RUNDIR="/home/$IGconf_device_user1"

      if [ -n "${IGconf_kiosk_url:-}" ]; then
        export KIOSK_URL="$IGconf_kiosk_url"
      else
        export KIOSK_URL="http://localhost:$IGconf_kiosk_port"
      fi

      export KIOSK_APP="/usr/bin/chromium $KIOSK_URL --kiosk --ash-hide-cursor --noerrdialogs --disable-infobars --no-first-run --enable-features=OverlayScrollbar --start-maximized"
      envsubst < kiosk.service.tpl > $1/etc/systemd/system/kiosk.service
    - $BDEBSTRAP_HOOKS/enable-units "$1" kiosk
