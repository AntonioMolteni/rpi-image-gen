include:
  file: trixie-minbase-ab.yaml

image:
  system_part_size: 2200M # Jellyfin + Cage + wayland + chromium + deps
  name: digilock-kiosk-image

device:
  user1: pi
  user1pass: Debug123!
  user1sudo: passwd

layer:
  app: digilock-kiosk
  extra: rpi-splash-screen

splash:
  image_path: ${@SRCROOT}/splash.tga

kiosk:
  # 1) Real app package to install
  app_pkg: jellyfin

  # 2) Jellyfin apt repository info
  repo_url: https://repo.jellyfin.org/debian
  repo_suite: trixie
  repo_component: main

  # 3) Public key for that repository (stored in this repo)
  repo_key: ${@SRCROOT}/keyrings/digilock-kiosk-archive-keyring.asc

  # 4) Jellyfin serves on localhost:8096 and UI on /web/index.html
  port: 8096
  url: http://localhost:8096/web/index.html
